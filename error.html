
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .error-container {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            margin: 0;
            color: #dc2626;
            font-size: 80px;
        }

        h2 {
            color: #374151;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            color: white;
            background: #2563eb;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #1e40af;
        }
    </style>
</head>

<body>

    <main class="error-container">
        <h1>404</h1>

        <h2>Oops! Page Not Found</h2>

        <p>
            Sorry, the page you are looking for does not exist
            or may have been moved.
        </p>

        <a href="index.html">Back to Home</a>
    </main>

</body>
</html>
